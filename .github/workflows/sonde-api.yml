name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/patrimoine }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Course
        shell: bash
        run: |
          set +e
          mkdir -p shots
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          (async () => {
            const b = await pw.chromium.launch();
            const log=(...a)=>console.log(...a);
            const c = await b.newContext({ viewport:{width:1200,height:820} }); const p = await c.newPage();
            p.on('pageerror', e => log('pageerror', e.message.slice(0,300)));
            await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
            await p.fill('#search-input', 'place de la republique 13200 arles');
            await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
            await p.keyboard.press('Enter');
            await p.waitForSelector('.map-atelier:not([hidden])', {timeout:60000});
            await p.click('.map-atelier');
            await p.waitForFunction(()=>/périmètre/.test(document.querySelector('.at-site')?.textContent||''), null, {timeout:60000});
            p.on('console', m => { if (m.type()==='error' || /Relief/.test(m.text())) log('console', m.text().slice(0,200)); });
            p.on('response', r => { if (/wms-r/.test(r.url()) && !r.ok()) log('wms-r', r.status(), r.url().slice(0,160)); });
            await p.click('.at-replier').catch(()=>{});
            const vue = async (nom, zoom, pitch, bearing) => {
              await p.evaluate(([z, pt, br]) => { const m = document.querySelector('#vue-atelier').__carte; const c = m.getCenter(); m.jumpTo({ center:[c.lng,c.lat], zoom: z, pitch: pt, bearing: br }); }, [zoom, pitch, bearing]);
              await p.waitForTimeout(9000);
              log(nom, JSON.stringify(await p.evaluate(() => { const m = document.querySelector('#vue-atelier').__carte; const c = m.getCenter(); return { bati: (m.getSource('bati')?._data?.features || m.getSource('bati')?.serialize?.().data?.features || []).length, etatBati: document.querySelector('[data-couche="bati"] .at-etat')?.textContent, terrain: m.getTerrain(), alt: m.queryTerrainElevation ? m.queryTerrainElevation(c) : null, hill: m.getLayoutProperty('relief','visibility') }; })));
              await p.locator('.at-canvas canvas').screenshot({ path:`shots/${nom}.jpg`, quality:72, timeout:60000 }).catch(e=>log('capture', e.message.split('\n')[0]));
            };
            for (const c of ['patrimoine-mh','patrimoine-sites','patrimoine-spr']) await p.evaluate((c) => document.querySelector(`[data-couche="${c}"] .switch`).click(), c);
            await p.evaluate(() => document.querySelector('[data-couche="cadastre"] .switch').click());
            await p.waitForFunction(() => /monument|Aucun|indisponible/.test(document.querySelector('[data-couche="patrimoine-mh"] .at-etat')?.textContent||''), null, {timeout:90000}).catch(e=>log('attente', e.message.split('\n')[0]));
            for (const c of ['patrimoine-mh','patrimoine-sites','patrimoine-spr']) log('pat', c, await p.evaluate((c) => document.querySelector(`[data-couche="${c}"] .at-etat`)?.textContent, c));
            await p.click('.at-replier').catch(()=>{});
            await vue('pat-2d', 15.3, 0, 0);
            await vue('pat-proche', 16.6, 0, 0);
            await p.goto('http://localhost:4173/diagnostic-site/#diagnostic');
            await b.close();
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
