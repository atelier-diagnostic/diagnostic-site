name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/relief-masque }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Relief
        shell: bash
        run: |
          set +e
          mkdir -p shots
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          (async () => {
            const b = await pw.chromium.launch();
            const log=(...a)=>console.log(...a);
            for (const [nom, adr, theme] of [['grenoble','place grenette grenoble','light'],['marseille','2 rue jean 13004 marseille','light'],['chamonix','place du triangle de l amitie chamonix','dark']]) {
              const c = await b.newContext({ viewport:{width:1000,height:900}, colorScheme: theme }); const p = await c.newPage();
              p.on('console', m => { if (m.type()==='error') log('console', m.text().slice(0,200)); });
              await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
              await p.fill('#search-input', adr);
              await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
              await p.keyboard.press('Enter');
              const body = p.locator('#module-body-soleil');
              await p.waitForFunction(() => document.querySelector('#module-body-soleil canvas[data-chart=masque]'), null, {timeout:240000}).catch(e=>log('attente', e.message.split('\n')[0]));
              await p.click('#module-body-soleil >> xpath=.. >> .module-toggle').catch(()=>{});
              await p.evaluate(() => { const d = document.querySelector('#module-body-soleil'); d.hidden = false; d.closest('.module-card').classList.remove('collapsed'); d.querySelector('details')?.setAttribute('open',''); });
              await p.waitForTimeout(800);
              log(nom, (await body.innerText()).slice(0, 1200)); const ch = p.locator('#module-body-soleil canvas[data-chart=masque]'); await ch.scrollIntoViewIfNeeded(); await p.waitForTimeout(800); await ch.screenshot({ path:`shots/${nom}-masque.jpg`, quality:75 }).catch(e=>log('capture', e.message.split('\n')[0]));
              
              await c.close();
            }
            await b.close();
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
