name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/nature-ville }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Course
        shell: bash
        run: |
          set +e
          mkdir -p shots
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          (async () => {
            const b = await pw.chromium.launch();
            const log=(...a)=>console.log(...a);
            for (const [nom, adr] of [['marseille','2 rue jean 13004 marseille'],['arles','65 route de crau 13200 arles']]) {
              const c = await b.newContext({ viewport:{width:1100,height:900} }); const p = await c.newPage();
              p.on('pageerror', e => log('pageerror', e.message.slice(0,300)));
              await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
              await p.fill('#search-input', adr);
              await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
              await p.keyboard.press('Enter');
              await p.waitForFunction(() => /Couverture du sol/.test(document.querySelector('#module-body-nature')?.textContent||''), null, {timeout:180000}).catch(e=>log('attente', e.message.split('\n')[0]));
              await p.evaluate(() => { const d = document.querySelector('#module-body-nature'); d.hidden = false; d.closest('.module-card')?.classList.remove('collapsed'); });
              await p.waitForTimeout(800);
              log(nom, (await p.locator('#module-body-nature').innerText()).replace(/\s+/g,' ').slice(0, 1800));
              await p.locator('#module-body-nature').screenshot({ path:`shots/${nom}.jpg`, quality:75 }).catch(e=>log('capture', e.message.split('\n')[0]));
              log('synth', await p.evaluate(() => (document.body.innerText.match(/[^\n]*imperméabilis[^\n]*/g)||[]).slice(0,3).join(' | ')));
              await c.close();
            }
            await b.close();
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
