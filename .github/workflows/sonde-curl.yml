name: sonde-curl
on: { push: { branches: [claude/sonde-api] } }
jobs:
  curl:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for svc in 'wmts?SERVICE=WMTS&REQUEST=GetCapabilities' 'wms-r?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0' 'wms-v/ows?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0'; do
            curl -s "https://data.geopf.fr/$svc" -o cap.xml
            python3 - "$svc" <<'PY'
          import re,sys
          x=open('cap.xml',encoding='utf8',errors='ignore').read()
          svc=sys.argv[1].split('?')[0]
          if 'wmts' in svc:
              for blk in re.findall(r'<Layer>(.*?)</Layer>',x,re.S):
                  i=re.search(r'<ows:Identifier>([^<]+)',blk); t=re.search(r'<ows:Title>([^<]+)',blk)
                  if i and re.search(r'lidar|mnt|mns|mnh|elevation',i.group(1),re.I):
                      fmts=re.findall(r'<Format>([^<]+)',blk); tms=re.findall(r'<TileMatrixSet>([^<]+)',blk); lim=re.findall(r'<TileMatrix>(\d+)</TileMatrix>',blk)
                      print('WMTS',i.group(1),'|',t.group(1) if t else '','|',fmts,tms,(min(map(int,lim)),max(map(int,lim))) if lim else '')
          else:
              for n,t in re.findall(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>',x):
                  if re.search(r'lidar|mnt|mns|mnh|elevation',n,re.I): print(svc,n,'|',t)
          PY
          done
