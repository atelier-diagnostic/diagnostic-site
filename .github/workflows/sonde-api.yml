name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/photo-compose }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Course
        shell: bash
        run: |
          set +e
          mkdir -p shots
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          (async () => {
            const b = await pw.chromium.launch();
            const log=(...a)=>console.log(...a);
            const c = await b.newContext({ viewport:{width:1300,height:850} }); const p = await c.newPage();
            p.on('pageerror', e => log('pageerror', e.message.slice(0,300)));
            p.on('console', m => { if (m.type()==='error' && !/wmts|404|400/.test(m.text())) log('console', m.text().slice(0,200)); });
            await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
            await p.fill('#search-input', 'place estrangin pastre 13006 marseille');
            await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
            await p.keyboard.press('Enter');
            await p.waitForSelector('.map-atelier:not([hidden])', {timeout:60000});
            await p.click('.map-atelier');
            await p.waitForFunction(()=>/périmètre/.test(document.querySelector('.at-site')?.textContent||''), null, {timeout:60000});
            const vue = async (nom, zoom) => {
              await p.evaluate((z) => { const m = document.querySelector('#vue-atelier').__carte; const c = m.getCenter(); m.jumpTo({ center:[c.lng,c.lat], zoom: z }); }, zoom);
              await p.waitForTimeout(7000);
              await p.locator('.at-canvas canvas').screenshot({ path:`shots/${nom}.jpg`, quality:72, timeout:60000 }).catch(e=>log('capture', e.message.split('\n')[0]));
            };
            await p.click('[data-fond="compose"]');
            await p.waitForTimeout(3000);
            log('ign', await p.evaluate(() => { const m = document.querySelector('#vue-atelier').__carte; const ls = m.getStyle().layers.filter(l=>l.id.startsWith('ign-')); return [ls.length, ls.filter(l=>m.getLayoutProperty(l.id,'visibility')==='visible').length, document.querySelector('[data-couche="fond"] .at-etat')?.textContent]; }));
            await p.evaluate(() => document.querySelector('[data-couche="bati"] .switch').click());
            await p.click('.at-replier').catch(()=>{});
            
            await p.evaluate(() => { const c = document.querySelector('[data-photo-dessous]'); c.checked = true; c.dispatchEvent(new Event('change')); });
            await vue('photo-compose', 16.3);
            await b.close();
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
